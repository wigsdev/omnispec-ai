AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OmniSpec AI — Plataforma Agéntica de Ingeniería SDD y Seguridad AWS

Globals:
  Function:
    Timeout: 29
    MemorySize: 1024

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

Resources:
  # ============================================
  # Lambda Function (Container Image)
  # ============================================
  OmniSpecFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 29
      Environment:
        Variables:
          STAGE: !Ref Stage
          GITHUB_OAUTH_CLIENT_ID: '{{resolve:ssm:/omnispec/github-oauth-client-id}}'
          DYNAMODB_CACHE_TABLE: !Ref DynamoDBCache
          DYNAMODB_AUDIT_TABLE: !Ref DynamoDBAuditLog
          SSM_PREFIX: '/omnispec'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBCache
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBAuditLog
        - SSMParameterReadPolicy:
            ParameterName: 'omnispec/*'
      Events:
        ApiCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniSpecApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref OmniSpecApi
            Path: /
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

  # ============================================
  # HTTP API (API Gateway v2)
  # ============================================
  OmniSpecApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage

  # ============================================
  # DynamoDB — Cache Table
  # ============================================
  DynamoDBCache:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'omnispec-cache-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================
  # DynamoDB — Audit Log Table
  # ============================================
  DynamoDBAuditLog:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'omnispec-audit-log-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================
  # S3 Bucket — Frontend Static Files
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'omnispec-frontend-${Stage}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================
  # CloudFront OAC + Distribution
  # ============================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'omnispec-oac-${Stage}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - OmniSpecApi
      - FrontendBucket
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Comment: !Sub 'OmniSpec AI - ${Stage}'

        Origins:
          - Id: S3Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

          - Id: ApiGateway
            DomainName: !Sub '${OmniSpecApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: !Sub '/${Stage}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only

        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true

        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: ApiGateway
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${OmniSpecApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/'

  CloudFrontUrl:
    Description: CloudFront Distribution URL (producción)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  FrontendBucketName:
    Description: S3 Bucket for frontend files
    Value: !Ref FrontendBucket

  CacheTableName:
    Description: DynamoDB Cache Table
    Value: !Ref DynamoDBCache

  AuditLogTableName:
    Description: DynamoDB Audit Log Table
    Value: !Ref DynamoDBAuditLog
